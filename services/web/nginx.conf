server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location /actuator/ {
        proxy_pass http://api:8080/actuator/;
    }

    location = /login {
        rewrite ^ /login.html last;
    }

    location = /cart {
        rewrite ^ /cart.html last;
    }

    location = /checkout {
        rewrite ^ /checkout.html last;
    }

    location = /orders {
        rewrite ^ /orders.html last;
    }

    location ~ ^/products/ {
        rewrite ^ /product.html last;
    }

    location = /admin {
        rewrite ^ /admin.html last;
    }

    location = /admin/orders {
        rewrite ^ /admin-orders.html last;
    }

    location ~ ^/admin/orders/[0-9a-fA-F-]+$ {
        rewrite ^ /admin-orders.html last;
    }

    location = /admin/imports {
        rewrite ^ /imports.html last;
    }

    location ~ ^/admin/imports/[0-9a-fA-F-]+$ {
        rewrite ^ /imports.html last;
    }

    location / {
        try_files $uri /index.html;
    }
}
