<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin orders</title>
    <style>
      body { font-family: sans-serif; margin: 2rem; max-width: 48rem; }
      nav a { margin-right: 1rem; }
      article { border: 1px solid #ddd; padding: 0.75rem; margin: 0.75rem 0; }
    </style>
  </head>
  <body>
    <nav>
      <a href="/admin">Products</a>
      <a href="/admin/imports">CSV import</a>
      <a href="/admin/orders">Orders</a>
    </nav>
    <h1>All orders</h1>
    <p id="empty" hidden>No orders yet.</p>
    <div id="list"></div>
    <script>
      const basic = sessionStorage.getItem("basic");
      if (!basic) location.href = "/login";

      fetch("/api/admin/orders", { headers: { Authorization: "Basic " + basic } })
        .then((r) => {
          if (r.status === 401 || r.status === 403) location.href = "/login";
          return r.json();
        })
        .then((page) => {
          const items = page.items || [];
          document.getElementById("empty").hidden = items.length > 0;
          const list = document.getElementById("list");
          for (const o of items) {
            const art = document.createElement("article");
            const h = document.createElement("h2");
            h.textContent = o.status + " — $" + o.total;
            const p = document.createElement("p");
            p.textContent = o.id + " — " + o.createdAt;
            art.append(h, p);
            list.appendChild(art);
          }
        });
    </script>
  </body>
</html>
