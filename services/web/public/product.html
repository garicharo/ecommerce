<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product</title>
    <style>
      body { font-family: sans-serif; margin: 2rem; max-width: 40rem; }
      nav a { margin-right: 1rem; }
      .thumb { width: 100%; max-width: 20rem; aspect-ratio: 1; object-fit: cover; background: #eee; }
      .fallback { width: 100%; max-width: 20rem; aspect-ratio: 1; display: none; align-items: center; justify-content: center; background: #c5d4e8; font-size: 3rem; }
      .err { color: #b00020; }
      label { display: block; margin: 0.75rem 0; }
    </style>
  </head>
  <body>
    <nav>
      <a href="/">Shop</a>
      <a href="/cart">Cart</a>
      <a href="/login">Login</a>
    </nav>
    <p id="err" class="err"></p>
    <div id="main" hidden>
      <img id="img" class="thumb" alt="" />
      <div id="fb" class="fallback"></div>
      <h1 id="name"></h1>
      <p id="meta"></p>
      <p id="desc"></p>
      <label>Qty <input id="qty" type="number" min="1" value="1" /></label>
      <button type="button" id="add">Add to cart</button>
    </div>
    <script>
      const sku = decodeURIComponent(location.pathname.replace(/^\/products\//, ""));
      const basic = sessionStorage.getItem("basic");
      const err = document.getElementById("err");
      const qtyInput = document.getElementById("qty");

      fetch("/api/products/" + encodeURIComponent(sku))
        .then((r) => {
          if (!r.ok) throw new Error("not found");
          return r.json();
        })
        .then((p) => {
          document.getElementById("main").hidden = false;
          document.getElementById("name").textContent = p.name;
          document.getElementById("desc").textContent = p.description;
          document.getElementById("meta").textContent =
            "$" + p.price + " — " + p.weightKg + " kg — " + (p.stock === 0 ? "out of stock" : "stock " + p.stock);
          const img = document.getElementById("img");
          img.alt = p.name;
          img.src = "https://picsum.photos/seed/" + encodeURIComponent(p.sku) + "/600/600";
          const fb = document.getElementById("fb");
          fb.textContent = (p.name || "?").trim().slice(0, 2).toUpperCase();
          img.addEventListener("error", () => {
            img.style.display = "none";
            fb.style.display = "flex";
          });
          qtyInput.max = String(Math.max(p.stock, 1));
          const add = document.getElementById("add");
          if (p.stock === 0) {
            add.disabled = true;
            add.textContent = "Out of stock";
          }
          add.addEventListener("click", async () => {
            if (!basic) {
              location.href = "/login";
              return;
            }
            const qty = Number(qtyInput.value);
            if (qty < 1 || qty > p.stock) {
              err.textContent = "Qty must be between 1 and " + p.stock;
              return;
            }
            add.disabled = true;
            const res = await fetch("/api/cart/items", {
              method: "PUT",
              headers: {
                Authorization: "Basic " + basic,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ sku: p.sku, qty }),
            });
            add.disabled = false;
            if (res.status === 401) {
              location.href = "/login";
              return;
            }
            if (!res.ok) {
              err.textContent = "Could not add to cart (" + res.status + ")";
              return;
            }
            location.href = "/cart";
          });
        })
        .catch(() => {
          err.textContent = "Product not found.";
        });
    </script>
  </body>
</html>
