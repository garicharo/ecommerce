<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop</title>
    <style>
      body { font-family: sans-serif; margin: 2rem; max-width: 56rem; }
      nav a { margin-right: 1rem; }
      #toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end; margin: 1rem 0; }
      label { display: flex; flex-direction: column; font-size: 0.9rem; }
      input, select { min-width: 10rem; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 1rem; padding: 0; list-style: none; }
      article { border: 1px solid #ddd; padding: 0.5rem; }
      article a { color: inherit; text-decoration: none; }
      .thumb { width: 100%; aspect-ratio: 1; object-fit: cover; background: #eee; display: block; }
      .fallback { width: 100%; aspect-ratio: 1; display: none; align-items: center; justify-content: center; background: #c5d4e8; font-size: 2rem; }
      .oos { color: #666; }
      .badge { font-size: 0.8rem; }
      #pager { margin-top: 1rem; }
      #pager button { margin-right: 0.5rem; }
    </style>
  </head>
  <body>
    <nav>
      <a href="/">Shop</a>
      <a href="/cart">Cart</a>
      <a href="/orders">Orders</a>
      <a href="/login">Login</a>
      <a href="/admin">Admin</a>
    </nav>
    <h1>Shop</h1>
    <p>Public catalog. Search needs at least 2 characters.</p>
    <div id="toolbar">
      <label>Search
        <input id="q" type="search" autocomplete="off" />
      </label>
      <label>Category
        <select id="category">
          <option value="">All</option>
        </select>
      </label>
      <label>Sort
        <select id="sort">
          <option value="name_asc">Name</option>
          <option value="price_asc">Price (low)</option>
          <option value="price_desc">Price (high)</option>
        </select>
      </label>
    </div>
    <p id="status"></p>
    <ul id="grid"></ul>
    <p id="empty" hidden>No products yet.</p>
    <p id="pager">
      <button type="button" id="prev" hidden>Previous</button>
      <button type="button" id="next" hidden>Next</button>
    </p>
    <script>
      const qInput = document.getElementById("q");
      const categorySel = document.getElementById("category");
      const sortSel = document.getElementById("sort");
      const grid = document.getElementById("grid");
      const empty = document.getElementById("empty");
      const status = document.getElementById("status");
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");
      let page = 0;
      let debounceId = null;

      function params() {
        const usp = new URLSearchParams();
        const q = qInput.value.trim();
        if (q.length >= 2) usp.set("q", q);
        if (categorySel.value) usp.set("category", categorySel.value);
        usp.set("sort", sortSel.value);
        usp.set("page", String(page));
        usp.set("size", "20");
        return usp;
      }

      function initials(name) {
        return (name || "?").trim().slice(0, 2).toUpperCase();
      }

      async function loadCategories() {
        const data = await fetch("/api/products/categories").then((r) => r.json());
        for (const c of data.items || []) {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          categorySel.appendChild(opt);
        }
      }

      async function load() {
        status.textContent = "Loading…";
        const data = await fetch("/api/products?" + params().toString()).then((r) => r.json());
        const items = data.items || [];
        grid.replaceChildren();
        empty.hidden = items.length > 0;
        empty.textContent = qInput.value.trim().length >= 2 || categorySel.value
          ? "No products match."
          : "No products yet.";
        for (const p of items) {
          const li = document.createElement("li");
          const article = document.createElement("article");
          if (p.stock === 0) article.className = "oos";
          const a = document.createElement("a");
          a.href = "/products/" + encodeURIComponent(p.sku);
          const img = document.createElement("img");
          img.className = "thumb";
          img.alt = p.name;
          img.src = "https://picsum.photos/seed/" + encodeURIComponent(p.sku) + "/600/600";
          const fb = document.createElement("div");
          fb.className = "fallback";
          fb.textContent = initials(p.name);
          img.addEventListener("error", () => {
            img.style.display = "none";
            fb.style.display = "flex";
          });
          const title = document.createElement("p");
          title.textContent = p.name;
          const meta = document.createElement("p");
          meta.textContent = "$" + p.price;
          const badge = document.createElement("p");
          badge.className = "badge";
          badge.textContent = p.stock === 0 ? "Out of stock" : "Stock " + p.stock;
          a.append(img, fb, title, meta, badge);
          article.appendChild(a);
          li.appendChild(article);
          grid.appendChild(li);
        }
        const lastPage = data.size > 0 ? Math.max(Math.ceil(data.total / data.size) - 1, 0) : 0;
        prev.hidden = page <= 0;
        next.hidden = page >= lastPage || data.total === 0;
        status.textContent = data.total + " product(s)";
      }

      qInput.addEventListener("input", () => {
        clearTimeout(debounceId);
        debounceId = setTimeout(() => {
          page = 0;
          load();
        }, 300);
      });
      categorySel.addEventListener("change", () => { page = 0; load(); });
      sortSel.addEventListener("change", () => { page = 0; load(); });
      prev.addEventListener("click", () => { page -= 1; load(); });
      next.addEventListener("click", () => { page += 1; load(); });

      loadCategories().then(load);
    </script>
  </body>
</html>
