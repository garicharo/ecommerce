<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin</title>
    <style>
      body { font-family: sans-serif; margin: 2rem; max-width: 40rem; }
      label { display: block; margin: 0.5rem 0; }
      input { width: 100%; box-sizing: border-box; }
      button { margin-top: 0.75rem; }
      .err { color: #b00020; }
    </style>
  </head>
  <body>
    <nav>
      <a href="/">Shop</a>
      <a href="/admin">Products</a>
      <a href="/admin/imports">CSV import</a>
      <a href="/admin/orders">Orders</a>
      <a href="#" id="out">Log out</a>
    </nav>
    <h1>Admin</h1>
    <p>Create a product (MANUAL). CSV: <a href="/admin/imports">import jobs</a>.</p>
    <p class="err" id="err"></p>
    <form id="form">
      <label>SKU <input name="sku" required /></label>
      <label>Name <input name="name" required /></label>
      <label>Description <input name="description" required /></label>
      <label>Category <input name="category" required /></label>
      <label>Price <input name="price" required value="10.00" /></label>
      <label>Stock <input name="stock" type="number" min="0" required value="1" /></label>
      <label>Weight kg <input name="weightKg" required value="0.500" /></label>
      <button type="submit">Create</button>
    </form>
    <h2>Catalog</h2>
    <ul id="products"></ul>
    <script>
      const basic = sessionStorage.getItem("basic");
      if (!basic) location.href = "/login";

      document.getElementById("out").addEventListener("click", (e) => {
        e.preventDefault();
        sessionStorage.removeItem("basic");
        location.href = "/login";
      });

      async function load() {
        const page = await fetch("/api/products").then((r) => r.json());
        const ul = document.getElementById("products");
        ul.innerHTML = "";
        for (const p of page.items || []) {
          const li = document.createElement("li");
          li.textContent = p.sku + " — " + p.name + " — v" + p.version;
          ul.appendChild(li);
        }
      }

      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = {
          sku: fd.get("sku"),
          name: fd.get("name"),
          description: fd.get("description"),
          category: fd.get("category"),
          price: fd.get("price"),
          stock: Number(fd.get("stock")),
          weightKg: fd.get("weightKg"),
        };
        const res = await fetch("/api/admin/products", {
          method: "POST",
          headers: {
            Authorization: "Basic " + basic,
            "Content-Type": "application/json",
          },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          document.getElementById("err").textContent = "Create failed: " + res.status;
          return;
        }
        document.getElementById("err").textContent = "";
        e.target.reset();
        load();
      });

      load();
    </script>
  </body>
</html>
